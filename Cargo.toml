[package]
name = "authn_kit"
version = "0.0.1"
description = "Framework-agnostic, protocol-agnostic authentication primitives for Rust web services"
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ayushjain17/authn_kit"
readme = "README.md"
keywords = ["authentication", "oidc", "oauth2", "actix-web", "axum"]
categories = ["web-programming", "authentication"]

[features]
# No adapter and no mechanism by default: a consumer must choose its framework,
# so that an actix service never compiles axum in (or vice versa).
default = []

# --- framework adapters (pick exactly one) ---
actix = ["dep:actix-web", "dep:futures-util", "dep:log"]
axum = ["dep:axum", "dep:log"]

# --- authentication mechanisms (pick any) ---
oidc = ["dep:openidconnect", "dep:tokio", "dep:log", "dep:url"]

# Convenience constructors that read configuration from the environment.
# Optional: every type is constructible from explicit values without it.
env = []

# RFC 7662 token introspection. An OAuth 2.0 mechanism, so it needs no identity
# provider and does not imply `oidc`.
introspection = ["dep:reqwest"]

# Every authentication mechanism, for consumers that select their provider at
# runtime (from configuration or an environment variable) and therefore need all
# of them compiled in. Deliberately excludes the framework adapters, which are
# mutually exclusive in practice.
full = ["oidc", "introspection", "env"]

[dependencies]
actix-web = { version = "4.5.0", optional = true }
async-trait = "0.1.89"
axum = { version = "0.8", optional = true }
base64 = "0.21.2"
blake3 = "1.3.3"
futures-util = { version = "0.3.28", optional = true }
log = { version = "0.4.20", optional = true }
openidconnect = { version = "4", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "json",
    "rustls-tls",
] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum_macros = "0.25"
subtle = "2.6"
thiserror = "1"
tokio = { version = "1.29.1", optional = true, features = ["sync"] }
url = { version = "2.5.0", optional = true }

[dev-dependencies]
actix-rt = "2"
actix-web = "4.5.0"
chrono = { version = "0.4.26", features = ["serde"] }
env_logger = "0.11"
tokio = { version = "1.29.1", features = ["full"] }

[[example]]
name = "actix_service"
required-features = ["actix", "full"]

[lints.clippy]
mod_module_files = "warn"
manual_range_contains = "allow"
